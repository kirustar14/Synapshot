<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UNNAMED stimulus</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #07080b; overflow: hidden; height: 100%; }
  #c { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #s { position: absolute; left: 8px; top: 8px; font: 12px/1.4 ui-monospace, monospace;
       color: #3a4152; z-index: 2; white-space: pre; }
  #f { position: absolute; inset: 0; background: #fff; display: none; z-index: 3; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="f"></div>
<div id="s">stimulus: connecting</div>
<script>
// Logical page is 1080x1920 portrait. Everything is drawn in those coordinates and the
// canvas is scaled to the window, so gaze in normalized units means the same thing in
// the capture as it does here.
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const flashEl = document.getElementById('f');
const statusEl = document.getElementById('s');

// Mac monotonic clock mapping. The server sends its time.monotonic_ns() once at load and
// the page keeps the offset, so every event the page reports is on the rig's clock.
let monoOffsetNs = null;
function nowNs() {
  const perfNs = performance.now() * 1e6;
  return monoOffsetNs === null ? Math.round(perfNs) : Math.round(monoOffsetNs + perfNs);
}

let state = { kind: 'blank', params: {}, t0: performance.now() };
let avatar = 'idle';
let flashPending = false, flashFrames = 0, flashAt = 0;
let ws = null, fps = 0, lastFrame = performance.now(), frames = 0, fpsAt = performance.now();

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

function connect() {
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
    + (location.host || 'localhost:8000') + '/ws/stimulus';
  ws = new WebSocket(url);
  ws.onopen = () => {
    statusEl.textContent = 'stimulus: connected';
    send({ type: 'hello', perf_ns: Math.round(performance.now() * 1e6), w: W, h: H });
  };
  ws.onclose = () => { statusEl.textContent = 'stimulus: closed, retrying'; setTimeout(connect, 1000); };
  ws.onerror = () => { statusEl.textContent = 'stimulus: error'; };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    handle(msg);
  };
}

function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

function handle(msg) {
  if (msg.type === 'clock') {
    // offset so that nowNs() returns the rig's monotonic clock
    monoOffsetNs = msg.mono_ns - (msg.perf_ns || 0);
    send({ type: 'clock_ack', t_ns: nowNs() });
    return;
  }
  if (msg.type === 'show') {
    state = { kind: msg.kind || 'blank', params: msg.params || {}, t0: performance.now() };
    send({ type: 'shown', kind: state.kind, params: state.params, t_ns: nowNs() });
    return;
  }
  if (msg.type === 'flash') {
    flashPending = true;
    return;
  }
  if (msg.type === 'avatar') {
    avatar = msg.state === 'talking' ? 'talking' : 'idle';
    return;
  }
}

// One frame flash. The overlay is turned on inside a frame, the frame time is reported,
// and it is turned off on the very next frame, so exactly one rendered frame is white.
function runFlash() {
  if (flashPending && flashFrames === 0) {
    flashEl.style.display = 'block';
    flashFrames = 1;
    flashAt = nowNs();
    return;
  }
  if (flashFrames === 1) {
    flashEl.style.display = 'none';
    flashFrames = 0;
    flashPending = false;
    send({ type: 'flashed', t_ns: flashAt, frame_ms: Math.round(1000 / Math.max(fps, 1)) });
  }
}

function dot(x, y, r, color) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function drawCalib(t) {
  // Nine dots, one second each, in the same order gaze.py expects.
  const pts = [[0.15,0.15],[0.5,0.15],[0.85,0.15],[0.15,0.5],[0.5,0.5],[0.85,0.5],
               [0.15,0.85],[0.5,0.85],[0.85,0.85]];
  const i = Math.min(8, Math.floor(t));
  const p = pts[i];
  dot(p[0] * W, p[1] * H, 26, '#ffffff');
  dot(p[0] * W, p[1] * H, 8, '#e8544f');
}

function drawPursuit(t, vertical, params) {
  const amp = params.amp === undefined ? 0.35 : params.amp;
  const f = params.freq === undefined ? 0.4 : params.freq;
  const u = 0.5 + amp * Math.sin(2 * Math.PI * f * t);
  const x = vertical ? 0.5 : u, y = vertical ? u : 0.5;
  dot(x * W, y * H, 22, '#ffffff');
}

function drawStep(t, params, anti) {
  // Two second trials: centre for 0.4 s, then the target to one side for 1.2 s.
  const per = 2.0, trial = Math.floor(t / per), u = t % per;
  const side = (Math.sin(trial * 12.9898) > 0) ? 1 : -1;
  if (u < 0.4) {
    dot(0.5 * W, 0.5 * H, 20, '#ffffff');
  } else if (u < 1.6) {
    const x = 0.5 + side * 0.3;
    dot(x * W, 0.5 * H, 20, anti ? '#f0a33c' : '#ffffff');
    if (anti) {
      ctx.strokeStyle = '#2a3040';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc((0.5 - side * 0.3) * W, 0.5 * H, 24, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function drawFixation() {
  dot(0.5 * W, 0.5 * H, 14, '#ffffff');
  ctx.strokeStyle = '#2a3040';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0.5 * W - 60, 0.5 * H); ctx.lineTo(0.5 * W + 60, 0.5 * H);
  ctx.moveTo(0.5 * W, 0.5 * H - 60); ctx.lineTo(0.5 * W, 0.5 * H + 60);
  ctx.stroke();
}

function drawNpc(t) {
  // Near point of convergence: the target grows as if coming toward the patient.
  const r = 14 + 26 * Math.min(1, t / 12);
  dot(0.5 * W, 0.42 * H, r, '#ffffff');
  label('Say "now" when it goes double', 0.62);
}

function drawDigits(t, params) {
  // Rapid number naming: our own digit cards, five rows of five.
  const cards = params.cards === undefined ? 4 : params.cards;
  const card = Math.min(cards - 1, Math.floor(t / 10));
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 86px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const n = 1 + ((r * 5 + c + card * 7) % 9);
      ctx.fillText(String(n), (0.14 + c * 0.18) * W, (0.3 + r * 0.1) * H);
    }
  }
  ctx.font = '400 34px system-ui, sans-serif';
  ctx.fillStyle = '#5b6478';
  ctx.fillText('card ' + (card + 1) + ' of ' + cards, 0.5 * W, 0.84 * H);
}

function drawPicture() {
  // A simple scene with enough going on to describe for a minute, drawn not loaded.
  ctx.fillStyle = '#121725'; ctx.fillRect(0.08 * W, 0.26 * H, 0.84 * W, 0.44 * H);
  ctx.fillStyle = '#20304a'; ctx.fillRect(0.08 * W, 0.56 * H, 0.84 * W, 0.14 * H);
  ctx.fillStyle = '#e8c77a'; dot(0.72 * W, 0.33 * H, 46, '#e8c77a');
  ctx.fillStyle = '#2f4a35';
  ctx.beginPath(); ctx.moveTo(0.2 * W, 0.56 * H); ctx.lineTo(0.3 * W, 0.36 * H);
  ctx.lineTo(0.4 * W, 0.56 * H); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0.36 * W, 0.56 * H); ctx.lineTo(0.47 * W, 0.4 * H);
  ctx.lineTo(0.58 * W, 0.56 * H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a93a8'; ctx.fillRect(0.6 * W, 0.46 * H, 0.1 * W, 0.1 * H);
  ctx.fillStyle = '#e8544f'; dot(0.5 * W, 0.62 * H, 18, '#e8544f');
  label('Tell me about this picture', 0.76);
}

function label(text, y) {
  ctx.fillStyle = '#6b7488';
  ctx.font = '400 38px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 0.5 * W, y * H);
}

function drawAvatar(t) {
  // A calm face, low contrast, nothing that competes with a target dot. The mouth moves
  // only while the agent is speaking.
  const cx = 0.5 * W, cy = 0.5 * H;
  dot(cx, cy, 250, '#141a28');
  dot(cx, cy, 240, '#1a2236');
  const blink = (t % 4.2) < 0.14 ? 0.12 : 1.0;
  ctx.fillStyle = '#cfd6e6';
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(cx + sx * 80, cy - 50, 26, 26 * blink, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  const open = avatar === 'talking' ? 14 + 22 * Math.abs(Math.sin(t * 7.5)) : 7;
  ctx.fillStyle = '#9aa4ba';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 90, 62, open, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2a3447'; ctx.lineWidth = 6;
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(cx + sx * 80, cy - 100, 44, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  }
}

function frame() {
  const now = performance.now();
  frames++;
  if (now - fpsAt > 500) { fps = frames * 1000 / (now - fpsAt); frames = 0; fpsAt = now; }
  lastFrame = now;
  const t = (now - state.t0) / 1000;

  ctx.fillStyle = '#07080b';
  ctx.fillRect(0, 0, W, H);

  switch (state.kind) {
    case 'calib': drawCalib(t); break;
    case 'pursuit_h': drawPursuit(t, false, state.params); break;
    case 'pursuit_v': drawPursuit(t, true, state.params); break;
    case 'saccade': drawStep(t, state.params, false); break;
    case 'antisaccade': drawStep(t, state.params, true); break;
    case 'fixation': drawFixation(); break;
    case 'npc': drawNpc(t); break;
    case 'digits': drawDigits(t, state.params); break;
    case 'picture': drawPicture(); break;
    case 'avatar_idle': drawAvatar(t); break;
    default: drawAvatar(t); break;
  }

  statusEl.textContent = 'stimulus: ' + state.kind + '  ' + fps.toFixed(0) + ' fps'
    + (monoOffsetNs === null ? '  clock: local' : '  clock: rig');

  runFlash();
  requestAnimationFrame(frame);
}

connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
